<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Employee Portal</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="main">
        <header class="topbar">
          <h1>Dashboard</h1>
          <div class="user"><span class="avatar" id="avatar">U</span><span id="userName">Loading...</span></div>
        </header>
        <main class="content">
          <section class="stats">
            <div class="stat"><div class="label">Current Status</div><div class="value s-out" id="status">Checked Out</div></div>
            <div class="stat"><div class="label">Check-In Time</div><div class="value num" id="checkIn">--:--</div></div>
            <div class="stat"><div class="label">Work Duration</div><div class="value num" id="workDur">00:00:00</div></div>
            <div class="stat"><div class="label">Total Break Time</div><div class="value num" id="breakDur">00:00:00</div></div>
          </section>

          <section class="panel">
            <h3>Quick Actions</h3>
            <p class="sub" id="actionsSub">Manage your daily attendance here.</p>
            <div class="actions">
              <button class="btn green" type="button" data-event="time_in" disabled>Time-In</button>
              <button class="btn amber" type="button" data-event="break_start" disabled>Take Break</button>
              <button class="btn" type="button" data-event="break_end" disabled>End Break</button>
              <button class="btn red" type="button" data-event="time_out" disabled>Time-Out</button>
            </div>
          </section>

          <section class="panel">
            <h3>Today's Activity Log</h3>
            <div class="table-wrap spaced">
              <table>
                <thead><tr><th>Type</th><th>Time</th><th>Status</th></tr></thead>
                <tbody id="log"><tr><td colspan="3" class="empty">No activity recorded today.</td></tr></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/pages/dashboard.ts"></script>
  </body>
</html>
